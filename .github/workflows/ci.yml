name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install isolated launch test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed runtime artifacts
        run: node scripts/build-runtime.mjs --check

      - name: Typecheck
        run: bun run typecheck

      - name: Biome lint (Wall 7b — static analysis)
        # Initial adoption with a curated rule set known to already pass on
        # the repo: correctness (noConstAssign, noUnreachable, etc.), security
        # (noGlobalEval), suspicious (noDebugger, noFocusedTests/noSkippedTests
        # — catches .skip/.only regressions alongside the existing grep-based
        # check), and complexity (noExtraBooleanCast, noUselessConstructor).
        # Formatter is disabled to keep this PR a no-op on existing style.
        # Tightening to recommended + specific style rules is tracked in
        # follow-up bds (see 000-docs/QUALITY_GATES.md §7b for the roadmap).
        run: bunx @biomejs/biome check .

      - name: Test
        run: bun test

      - name: Coverage floor (≥95% line + function)
        run: bash scripts/coverage-floor.sh 95

      - name: Architecture rules (dependency-cruiser)
        # Note: dependency-cruiser v17 removed the `--validate` flag; passing
        # `-c/--config` now runs validation automatically. Omitting `--validate`
        # so the step actually fails on violations (with `--validate` v17 silently
        # prints help + exits 0, defeating the point of the CI gate).
        run: bunx depcruise --config .dependency-cruiser.js .

      - name: Gherkin lint (Wall 1)
        # Enforces declarative-style acceptance contracts for the security
        # primitives. See features/README.md. Lint-only today — runner deferred.
        run: bash scripts/gherkin-lint.sh --path features/ --strict

      - name: Harness-hash verify (tamper check)
        # Pins features/*.feature and .dependency-cruiser.js by SHA-256. Any
        # byte edit to a pinned file without re-running --init fails here.
        run: bash scripts/harness-hash.sh --verify

      - name: Dependency vulnerability audit (bun audit)
        # Native bun gate against the GitHub Advisory Database. Only fails on
        # NEW high/critical advisories; known highs in transitive deps we cannot
        # patch from this repo are ignored until the owning package ships a fix.
        # Ignores (all transitive, not reachable via our public surface):
        #   GHSA-j3q9-mxjg-w52f — path-to-regexp in @modelcontextprotocol/sdk
        #   GHSA-7p8r-x3mc-p8w7 — fast-uri via ajv (MCP SDK + stryker)
        #   GHSA-mwp4-54f8-5fhr — ip-address via express-rate-limit (MCP SDK)
        #   GHSA-rgw5-rvv9-x895 — brace-expansion via minimatch (stryker only)
        # Tracked: reopen when SDK/stryker bump the nested deps.
        run: >
          bun audit --audit-level=high
          --ignore=GHSA-j3q9-mxjg-w52f
          --ignore=GHSA-7p8r-x3mc-p8w7
          --ignore=GHSA-mwp4-54f8-5fhr
          --ignore=GHSA-rgw5-rvv9-x895

      - name: Cyclomatic complexity (Wall 5 — ideal gate)
        # TS-aware AST walker over production sources. Threshold set to 30 —
        # the Wall 5 ideal. All four prior outliers (MCP dispatch, interactive
        # handler, handleMessage, gate) refactored under ccsc-53g. Current
        # ceiling is 28 (server.ts) — ~2 points of headroom.
        run: bun scripts/crap-score.ts --threshold 30

      # Exercise the documented minimum with the actual copied native entry.
      # All existing gates above continue to run with the current Node 22 line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20.0.0'

      - name: Verify bundle and isolated protocol on Node minimum
        run: |
          node --version
          node scripts/build-runtime.mjs --check
          bun test slack-runtime.test.ts
